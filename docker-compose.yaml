services:
  rabbitmq:
    container_name: ${RABBITMQ_HOST}
    hostname: ${RABBITMQ_HOST}
    image: rabbitmq:4-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
      - RABBITMQ_DEFAULT_VHOST=${NODE_ENV}
    ports:
      - '${RABBITMQ_PORT}:5672'
      - 15672:15672
    # volumes:
    #   - ./.volumes/rabbitmq/data/:/var/lib/rabbitmq/
    #   - ./.volumes/rabbitmq/log/:/var/log/rabbitmq
    restart: always
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - local-development

  main-db:
    image: mysql:8.0.37
    container_name: ${MAIN_DB_HOST}
    hostname: ${MAIN_DB_HOST}
    environment:
      - MYSQL_DATABASE=${MAIN_DB_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MAIN_DB_PASSWORD}
      - MYSQL_USER=${MAIN_DB_USERNAME}
      - MYSQL_PASSWORD=${MAIN_DB_PASSWORD}
    ports:
      - '3309:3306'
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    # - ./.volumes/main-db:/var/lib/mysql
    command: >
      mysqld --server-id=1
             --log-bin=mysql-bin
             --binlog-format=ROW
             --binlog-row-image=FULL
    restart: always
    networks:
      - local-development
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          '${MAIN_DB_USERNAME}',
          '-p${MAIN_DB_PASSWORD}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-db:
    container_name: ${REDIS_HOST}
    hostname: ${REDIS_HOST}
    image: redis:7.0
    environment:
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    # volumes:
    #   - ./.volumes/redis-db:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --port ${REDIS_PORT}
    restart: always
    networks:
      - local-development
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -p $$REDIS_PORT -a $$REDIS_PASSWORD ping || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  maxwell:
    image: zendesk/maxwell
    container_name: maxwell
    hostname: maxwell
    depends_on:
      main-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - MAIN_DB_DATABASE=${MAIN_DB_DATABASE}
      - MAIN_DB_USERNAME=${MAIN_DB_USERNAME}
      - MAIN_DB_PASSWORD=${MAIN_DB_PASSWORD}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - NODE_ENV=${NODE_ENV}
    entrypoint: ['/config/entrypoint.sh']
    volumes:
      - ./maxwell/entrypoint.sh:/config/entrypoint.sh
      - ./maxwell/config.template.properties:/config/config.template.properties
    networks:
      - local-development

  chat:
    container_name: chat
    hostname: chat
    build:
      context: .
      dockerfile: ./Dockerfile
      target: development
    volumes:
      - ./src:/app/src
    environment:
      - NODE_ENV
      - PORT

      - MODULE_NAME

      - MAIN_DB_HOST
      - MAIN_DB_PORT
      - MAIN_DB_DATABASE
      - MAIN_DB_USERNAME
      - MAIN_DB_ROLE
      - MAIN_DB_PASSWORD

      - RABBITMQ_HOST
      - RABBITMQ_PORT
      - RABBITMQ_USER
      - RABBITMQ_PASS

      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD

      - CHAT_EXCHANGE
      - MESSAGE_EXCHANGE

    ports:
      - '${PORT}:${PORT}'
    command:
      - npm run start:migrate:dev
    entrypoint: /bin/sh -c
    # healthcheck:
    #   test:
    #     [
    #       'CMD',
    #       'curl',
    #       '-s',
    #       'http://localhost:3000/check/liveness',
    #       '||',
    #       'exit 1',
    #     ]
    #   interval: 20s
    #   timeout: 20s
    #   retries: 5
    depends_on:
      main-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis-db:
        condition: service_healthy
    privileged: true
    networks:
      - local-development

networks:
  local-development:
    external: false
    driver: bridge
