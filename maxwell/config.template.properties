# Maxwell configuration
log_level=info

# MySQL connection
host=main-db
port=3306
user=${MAIN_DB_USERNAME}
password=${MAIN_DB_PASSWORD}
# Maxwell metadata stored in 'chat' database
schema_database=chat

# RabbitMQ producer
producer=rabbitmq
rabbitmq_host=rabbitmq
rabbitmq_port=5672
rabbitmq_user=${RABBITMQ_USER}
rabbitmq_pass=${RABBITMQ_PASS}
rabbitmq_virtual_host=${NODE_ENV}
rabbitmq_exchange=x.chat-service
rabbitmq_exchange_type=topic
# Static routing key - OutboxTransformerProcessor handles dynamic routing based on outbox data
rabbitmq_routing_key_template=outbox.event
rabbitmq_exchange_durable=true
rabbitmq_exchange_autodelete=false
rabbitmq_message_persistent=true

# Filter to only capture outbox table from chat-service database
# Explicitly exclude all tables first, then include only outbox
filter=exclude: *.*, include: ${MAIN_DB_DATABASE}.outbox

# Don't output DDL changes
output_ddl=false

